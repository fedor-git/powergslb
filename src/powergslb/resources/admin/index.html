<!DOCTYPE html>
<html lang="en">
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<head>
    <title>PowerGSLB: Admin</title>
    <link href="src/favicon.svg" rel="icon" type="image/svg+xml"/>
    <link href="src/w2ui-1.4.3.min.css" rel="stylesheet" type="text/css"/>
    <link href="src/powergslb-2.4.3.css" rel="stylesheet" type="text/css"/>
    <script src="src/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script src="src/w2ui-1.4.3.min.js" type="text/javascript"></script>
    <script src="src/powergslb-2.4.3.js" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .admin-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
            z-index: 100;
        }
        
        html[data-theme="dark"] .admin-header {
            background-color: #2d2d2d;
            border-bottom-color: #444;
        }
        
        .logout-button {
            padding: 8px 16px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        
        .logout-button:hover {
            background-color: #da190b;
        }
        
        .logout-button:active {
            transform: scale(0.98);
        }
        
        #powergslb-container {
            flex: 1;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div class="admin-header" id="adminHeader" style="display:none;">
    <button class="logout-button" id="logoutBtn">Logout</button>
</div>
<div id="powergslb-container">
    <div id="powergslb" style="width: 100%; height: 100%;"></div>
</div>

<script>
    // JWT Token Management
    (function() {
        const token = localStorage.getItem('powergslb_token');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminHeader = document.getElementById('adminHeader');

        // Check if token exists, if not redirect to login
        if (!token) {
            window.location.href = '/admin/login.html';
            return;
        }

        // Show header and logout button
        adminHeader.style.display = 'flex';

        // Add JWT token to all AJAX requests
        $(document).ajaxSend(function(event, jqXHR) {
            jqXHR.setRequestHeader('Authorization', 'Bearer ' + token);
        });

        // Handle logout
        logoutBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('powergslb_token');
                localStorage.removeItem('powergslb_username');
                window.location.href = '/admin/login.html';
            }
        });

        // Optional: Validate token on page load
        // You can add token expiration check here and redirect to login if needed
    })();
</script>
</body>
</html>
