<!DOCTYPE html>
<html lang="en" data-theme="light">
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<head>
    <title>PowerGSLB: Admin</title>
    <link href="src/favicon.svg" rel="icon" type="image/svg+xml"/>
    <link href="src/w2ui-1.4.3.min.css" rel="stylesheet" type="text/css"/>
    <link href="src/powergslb-2.4.3.css" rel="stylesheet" type="text/css"/>
    <script src="src/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script src="src/w2ui-1.4.3.min.js" type="text/javascript"></script>
    <script src="src/powergslb-2.4.3.js" type="text/javascript"></script>
</head>
<body>
    <div id="powergslb-container">
        <div id="powergslb" style="width: 100%; height: calc(100vh - 16px);"></div>
    </div>
<script>
    // ====================================
    // JWT Token Management
    // ====================================
    (function() {
        const token = localStorage.getItem('powergslb_token');

        // Check if token exists, if not redirect to login
        if (!token) {
            window.location.href = '/login';
            return;
        }

        // Add JWT token to all AJAX requests
        $(document).ajaxSend(function(event, jqXHR) {
            jqXHR.setRequestHeader('Authorization', 'Bearer ' + token);
        });
    })();
</script>
</body>
</html>
