<!DOCTYPE html>
<html lang="en" data-theme="light">
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<head>
    <title>PowerGSLB: Login</title>
    <link href="src/favicon.svg" rel="icon" type="image/svg+xml"/>
    <link href="src/powergslb-2.4.3.css" rel="stylesheet" type="text/css"/>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--pg-bg, #f5f5f5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
        }
        
        html[data-theme="dark"] body {
            background-color: var(--pg-bg, #1a1a1a);
        }
        
        .login-form-container {
            width: 400px;
            padding: 20px;
            background-color: var(--pg-surface, #fff);
            border: 1px solid var(--pg-border, #e0e0e0);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        html[data-theme="dark"] .login-form-container {
            background-color: var(--pg-surface, #2d2d2d);
            border-color: var(--pg-border, #555);
        }
        
        .login-form-container h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 600;
            color: var(--pg-text, #333);
        }
        
        .login-form-container .subtitle {
            margin: 0 0 20px 0;
            color: var(--pg-muted, #999);
            font-size: 13px;
            font-weight: 400;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--pg-text, #333);
            font-size: 13px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--pg-border, #e0e0e0);
            border-radius: 3px;
            background-color: var(--pg-field, #fff);
            color: var(--pg-text, #333);
            box-sizing: border-box;
            font-size: 13px;
            font-family: inherit;
        }
        
        html[data-theme="dark"] .form-group input[type="text"],
        html[data-theme="dark"] .form-group input[type="password"] {
            background-color: var(--pg-field, #3a3a3e);
            border-color: var(--pg-field-border, #555);
            color: var(--pg-text, #e0e0e0);
        }
        
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            font-size: 13px;
            cursor: pointer;
            color: var(--pg-text, #333);
        }
        
        .error-message {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            color: #c33;
            background-color: #fee;
            border: 1px solid #fcc;
            border-radius: 3px;
            font-size: 13px;
        }
        
        .success-message {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            color: #3c3;
            background-color: #efe;
            border: 1px solid #cfc;
            border-radius: 3px;
            font-size: 13px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 8px 20px;
            border: 1px solid var(--pg-border, #e0e0e0);
            border-radius: 3px;
            background-color: var(--pg-surface, #fff);
            color: var(--pg-text, #333);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }
        
        html[data-theme="dark"] .btn {
            background-color: var(--pg-surface, #2d2d2d);
            border-color: var(--pg-border, #555);
            color: var(--pg-text, #e0e0e0);
        }
        
        .btn:hover {
            background-color: var(--pg-hover, #f0f0f0);
        }
        
        html[data-theme="dark"] .btn:hover {
            background-color: var(--pg-hover, #3a3a3e);
        }
        
        .btn.btn-green {
            background-color: #4caf50;
            border-color: #4caf50;
            color: white;
        }
        
        .btn.btn-green:hover {
            background-color: #45a049;
        }
        
        .loading {
            display: none;
            font-size: 13px;
            color: var(--pg-muted, #999);
            text-align: center;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--pg-muted, #999);
        }
    </style>
</head>
<body>
    <div class="login-form-container">
        <h1 style="text-align: center;">PowerGSLB</h1>
        <p class="subtitle"></p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required/>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe"/>
                    <label for="rememberMe">Remember me</label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-green" id="loginButton">Login</button>
            </div>

            <div id="loading" class="loading">
                Logging in...
            </div>
        </form>

        <div class="footer-text">PowerGSLB Admin Panel v2.4.3</div>
    </div>

    <script>
        // ====================================
        // Theme Management
        // ====================================
        function initTheme() {
            const savedTheme = localStorage.getItem('powergslb.theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Initialize theme on page load
        document.addEventListener('DOMContentLoaded', initTheme);

        // ====================================
        // Login Form Management
        // ====================================
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loading = document.getElementById('loading');

        // Load saved username if "Remember me" was previously checked
        window.addEventListener('load', function () {
            const savedUsername = localStorage.getItem('powergslb_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }
        });

        // Handle login form submission
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            // Clear previous messages
            hideError();
            hideSuccess();

            // Show loading indicator
            loginButton.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Store token
                    localStorage.setItem('powergslb_token', data.token);

                    // Save username if "Remember me" is checked
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('powergslb_username', username);
                    } else {
                        localStorage.removeItem('powergslb_username');
                    }

                    showSuccess('Login successful! Redirecting...');

                    // Redirect to admin panel
                    setTimeout(function () {
                        window.location.href = '/admin/';
                    }, 1000);
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                    loginButton.disabled = false;
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred during login. Please try again.');
                loginButton.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
        }

        function hideSuccess() {
            successMessage.style.display = 'none';
        }
    </script>
</body>
</html>
