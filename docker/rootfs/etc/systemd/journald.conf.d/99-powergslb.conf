# The console receives errors, so `docker logs` shows what needs attention. `journalctl` keeps everything.
[Journal]
ForwardToConsole=yes
MaxLevelConsole=err
TTYPath=/dev/console
ReadKMsg=no

# The journal is volatile (the image ships no /var/log/journal), so it lives in the /run tmpfs.
RuntimeMaxUse=32M
RuntimeKeepFree=16M
RuntimeMaxFileSize=8M
RuntimeMaxFiles=4
